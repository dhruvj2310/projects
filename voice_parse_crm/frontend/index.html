<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FieldIntel — Voice to CRM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="left-panel">
    <div class="brand">
      <div class="brand-tag">Voice → CRM</div>
      <div class="brand-name">Field<span>Intel</span></div>
    </div>

    <div class="record-zone">
      <div class="record-label">Voice Input</div>
      <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
        <div class="mic-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <span id="micLabel">Tap to Record</span>
      </button>
      <div class="recording-indicator" id="recIndicator">
        <div class="rec-dot"></div>
        <span id="recTimer">Recording... 0s</span>
      </div>
    </div>

    <div class="waveform-area" id="waveformArea"></div>

    <div class="text-input-zone">
      <div class="divider-label">or type note</div>
      <textarea id="noteInput" placeholder="Just met Dhruv, wants 500 units by Tuesday, follow up tomorrow..."></textarea>
      <button class="send-btn" id="parseBtn" onclick="parseNote()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
        </svg>
        Parse & Add to CRM
      </button>
    </div>

    <div class="stats-strip">
      <div class="stat-item">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-lbl">Contacts</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statToday">0</div>
        <div class="stat-lbl">Today</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statUrgent">0</div>
        <div class="stat-lbl">Urgent</div>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="panel-header">
      <div class="panel-title">Lead Pipeline</div>
      <div class="panel-tabs">
        <button class="tab-btn active" onclick="switchTab(this,'table')">Table</button>
        <button class="tab-btn" onclick="switchTab(this,'kanban')">Kanban</button>
        <button class="tab-btn" onclick="switchTab(this,'timeline')">Timeline</button>
      </div>
    </div>

    <div class="processing-banner" id="processingBanner">
      <div class="spin"></div>
      <span id="processingText">Parsing your note with AI...</span>
    </div>

    <div class="crm-content" id="crmContent"></div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toastMsg"></span>
</div>

<script src="app.js"></script>
</body>
</html>
